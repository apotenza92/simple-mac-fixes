name: Publish download page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/index.html', 'docs/style.css', 'docs/downloads.js', 'docs/release-model.mjs', 'docs/assets/**', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release/test_downloads.mjs
      # The page reads releases live from GitHub, so it only redeploys when it changes.
      - name: Stage public page only
        run: |
          mkdir -p public/assets
          cp docs/index.html docs/style.css docs/downloads.js docs/release-model.mjs public/
          cp docs/assets/icon-stable-*.svg public/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
