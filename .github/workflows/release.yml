name: Release
# Builds, signs with Developer ID, notarizes and staples each architecture,
# publishes the GitHub release, then the Sparkle feeds on main. The Homebrew
# cask is uploaded as the "homebrew-cask" artifact for apotenza92/homebrew-tap.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'apotenza92/simple-mac-fixes'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install 'cryptography==45.0.7'
      - name: Validate release source and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 - "$RELEASE_TAG" <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts/release')
          from contract import parse_tag
          tag = parse_tag(sys.argv[1])['tag']
          notes = pathlib.Path('release-notes') / (tag + '.md')
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit('Add reviewed release-notes/' + tag + '.md before tagging')
          PY
      - id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "matrix=$(python3 scripts/release/contract.py "$RELEASE_TAG" --native-matrix)" >> "$GITHUB_OUTPUT"
  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
      - name: Native tests and development build
        run: scripts/test.sh
      - name: Sign, notarize, and verify each channel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARYTOOL_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARYTOOL_KEY_P8_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARYTOOL_KEY_ID: ${{ vars.APPLE_NOTARYTOOL_KEY_ID }}
          APPLE_NOTARYTOOL_ISSUER_ID: ${{ vars.APPLE_NOTARYTOOL_ISSUER_ID }}
        run: scripts/release/ci-package.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: build/releases/${{ github.ref_name }}/
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: sparkle-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install 'cryptography==45.0.7'
      - name: Verify exact asset set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts/release')
          from contract import ARCHITECTURES, package
          expected = set()
          for arch, _ in ARCHITECTURES:
              asset = package(sys.argv[1], 'stable', arch)['asset']
              expected.update([asset, asset + '.sha256', asset + '.notary.json'])
          actual = {p.name for p in pathlib.Path('dist').iterdir() if p.is_file()}
          if expected != actual:
              raise SystemExit('Release asset set does not match the contract')
          PY
          (cd dist && sha256sum -c -- *.sha256)
      - name: Sign update archives and write feeds and cask
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/prepare_publication.py "$RELEASE_TAG" dist publication
      # The Homebrew tap only publishes bundles attested by this workflow.
      - name: Attest Homebrew bundle
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: publication/homebrew-publication.tar.gz
      - name: Publish release, then feeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Upload everything to a draft first: releases become immutable when published,
          # and assets must be public before any feed points at them.
          gh release create "$RELEASE_TAG" dist/* publication/homebrew-publication.tar.gz --verify-tag --draft \
            --title "Simple Mac Fixes ${RELEASE_TAG#v}" --notes-file "release-notes/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
          mkdir -p appcasts
          cp publication/appcasts/*.xml appcasts/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appcasts
          git commit -m "Publish update feeds for $RELEASE_TAG"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-cask
          path: publication/Casks/
          if-no-files-found: error
